name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  deno-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - name: Run Deno tests (Supabase Edge Functions)
        run: deno test -A supabase/functions/search supabase/functions/sample-ballot

