<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectorMap & Downballot Finder</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20512%20512'%3E%3Cg%3E%3Cpath%20fill='%23FFC933'%20d='M160%20256h192l64%20192H96z'/%3E%3Cpath%20fill='%23FF6B81'%20d='M352%20256h0l64%20192H224c88-32%20128-96%20128-192z'/%3E%3Cpath%20fill='%235AB7FF'%20d='M160%20256h0L96%20448h160c-64-32-96-64-96-128%200-32%200-48%200-64z'/%3E%3C/g%3E%3Cg%20transform='translate(64%200)%20scale(0.35)'%3E%3Cpath%20fill='%235AB7FF'%20d='M256%2032c-70.7%200-128%2057.3-128%20128%200%2096%20128%20320%20128%20320s128-224%20128-320C384%2089.3%20326.7%2032%20256%2032zm0%20176c-26.5%200-48-21.5-48-48s21.5-48%2048-48%2048%2021.5%2048%2048-21.5%2048-48%2048z'/%3E%3C/g%3E%3Cg%20transform='translate(210%20-20)%20scale(0.45)'%3E%3Cpath%20fill='%23FFC933'%20d='M256%2032c-70.7%200-128%2057.3-128%20128%200%2096%20128%20320%20128%20320s128-224%20128-320C384%2089.3%20326.7%2032%20256%2032zm0%20176c-26.5%200-48-21.5-48-48s21.5-48%2048-48%2048%2021.5%2048%2048-21.5%2048-48%2048z'/%3E%3C/g%3E%3Cg%20transform='translate(336%2060)%20scale(0.35)'%3E%3Cpath%20fill='%23FF6B81'%20d='M256%2032c-70.7%200-128%2057.3-128%20128%200%2096%20128%20320%20128%20320s128-224%20128-320C384%2089.3%20326.7%2032%20256%2032zm0%20176c-26.5%200-48-21.5-48-48s21.5-48%2048-48%2048%2021.5%2048%2048-21.5%2048-48%2048z'/%3E%3C/g%3E%3C/svg%3E" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <div id="app">
        <header>
            <h1>ElectorMap & Downballot Finder</h1>
            <div class="search-container">
                <div class="input-group">
                    <input type="text" id="address-input" placeholder="Enter Full Address or ZIP+4" value="104 Ashton Oaks Court, Ashton, Maryland 20861" autocomplete="off">
                    <div id="autocomplete-list" class="autocomplete-items"></div>
                </div>
                <label class="search-toggle">
                    <input type="checkbox" id="include-downballot" />
                    <span>Include downballot offices</span>
                </label>
                <button id="search-btn">Search</button>
                <button id="clear-btn" disabled>Clear</button>
            </div>
        </header>

        <main>
            <div id="map"></div>
            <div id="info-panel">
                <h2>District Information</h2>
                <div id="results">
                    <p class="placeholder">Search for an address to see districts and candidates.</p>
                    <div id="downballot-results"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
